<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倉儲標籤產生器 (支援多物品/無備用區)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
    
    .label-card {
      width: 210mm;
      height: 148.5mm;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
      padding: 12mm;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .preview-container {
        transform: scale(0.85);
        transform-origin: top center;
        margin-bottom: -15mm;
    }

    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .dragging { opacity: 0.5; background: #e5e7eb; }

    #print-area { display: none; }

    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      body { background: white; margin: 0; padding: 0; }
      #print-area {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .print-page {
        width: 210mm;
        height: 297mm;
        display: flex;
        flex-direction: column;
        page-break-after: always;
      }
      .label-card {
        box-shadow: none;
        border: 1px dashed #ccc;
        margin: 0;
      }
    }
    
    .multi-item-row { border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; margin-bottom: 8px; }
    .multi-item-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- 左側編輯區 -->
  <div class="w-1/3 h-full bg-white border-r border-gray-200 flex flex-col shadow-lg z-10 print:hidden">
    <div class="p-4 bg-teal-600 text-white flex justify-between items-center shrink-0">
      <h1 class="text-xl font-bold flex items-center gap-2">標籤資料設定</h1>
      <button onclick="downloadPreviewPNG()" class="bg-blue-500 hover:bg-blue-600 px-3 py-1 rounded text-sm shadow">單張 PNG 下載</button>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-4">
      
      <!-- 櫃位與版面設定 -->
      <div class="space-y-3 border p-4 rounded-lg bg-white shadow-sm">
        <div class="flex items-center justify-between">
            <h2 class="font-bold text-gray-800">📌 標籤基本設定</h2>
            <div class="text-sm cursor-pointer text-teal-600 hover:underline" onclick="toggleSection('layoutSection')">⚙️ 版面微調</div>
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">本標籤張貼櫃位 (Cabinet ID)</label>
          <input type="text" id="cabinetName" value="日用品櫃 01" class="w-full p-2 border rounded border-gray-300" oninput="updatePreview()">
        </div>
        
        <div id="layoutSection" class="hidden transition-all duration-300 mt-2 p-3 bg-gray-50 border rounded text-sm">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-gray-600 mb-1">櫃位字級 (px)</label>
                    <input type="number" id="cabinetNameSize" value="26" class="w-full p-1 border rounded" oninput="updatePreview()">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">物品名稱字級 (px)</label>
                    <input type="number" id="itemNameSize" value="28" class="w-full p-1 border rounded" oninput="updatePreview()">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">庫存數字級 (px)</label>
                    <input type="number" id="qtySize" value="24" class="w-full p-1 border rounded" oninput="updatePreview()">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">內文字級 (px)</label>
                    <input type="number" id="baseTextSize" value="16" class="w-full p-1 border rounded" oninput="updatePreview()">
                </div>
                <div class="col-span-2">
                    <label class="block text-gray-800 font-bold mb-1">整體區塊間隙 (Gap)</label>
                    <input type="number" id="gapSize" value="16" class="w-full p-1 border border-gray-400 rounded bg-white" oninput="updatePreview()">
                </div>
            </div>
        </div>
      </div>

      <!-- 物品清單 (多物品組合) -->
      <div class="border p-4 rounded-lg shadow-sm bg-blue-50 border-blue-200">
        <div class="flex justify-between items-center mb-3">
          <label class="font-bold text-blue-800">📦 櫃內存放物品清單</label>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded">支援多品項</span>
        </div>
        <div id="multiItemsContainer" class="space-y-3">
            <!-- JS 動態產生多物品輸入框 -->
        </div>
        <button onclick="addMultiItemRow()" class="w-full mt-3 py-2 border-2 border-dashed border-blue-400 text-blue-600 font-bold rounded hover:bg-blue-100">+ 新增同櫃物品</button>
      </div>

      <!-- 圖片上傳 (可選) -->
      <div class="border p-4 rounded-lg bg-gray-50">
        <label class="block text-sm font-bold text-gray-700 mb-1 flex justify-between">
            <span>🖼️ 櫃位實景圖 (選填)</span>
            <input type="checkbox" id="showImage" checked onchange="updatePreview()"> 顯示圖片
        </label>
        <div id="imageInputSection">
            <input type="file" id="imageUpload" accept="image/*" class="w-full text-sm mb-2" onchange="handleImageUpload(event)">
            <input type="text" id="imageUrl" placeholder="或貼上圖片網址" class="w-full p-2 border rounded text-sm" oninput="updateImageFromUrl()">
        </div>
      </div>

      <!-- 其他儲放區 (無其他區域處理) -->
      <div class="border p-4 rounded-lg bg-gray-50">
        <div class="flex justify-between items-center mb-2">
          <label class="font-bold text-gray-700 cursor-pointer flex items-center gap-2" onclick="toggleSection('locSection')">
              🔍 其他儲放區 <span id="locSectionIcon" class="text-gray-500 text-sm">▼</span>
          </label>
          <label class="flex items-center gap-1 text-sm cursor-pointer text-blue-600 font-bold">
            <input type="checkbox" id="noOtherLocsFlag" onchange="toggleNoOtherLocs()"> 本櫃限定(無其他區)
          </label>
        </div>
        <div id="locSection" class="transition-all duration-300">
            <div id="otherLocsContainer">
              <ul id="locList" class="space-y-2"></ul>
              <button onclick="addLocRow()" class="mt-2 text-sm text-blue-600 font-bold hover:underline">+ 新增儲位</button>
            </div>
            <div id="noLocMsg" class="hidden p-3 bg-gray-200 text-gray-600 rounded text-center font-bold text-sm">
                此櫃物品為「專屬存放」，無其他備用儲位。
            </div>
        </div>
      </div>

      <!-- 收納順序 (可折疊) -->
      <div class="border p-4 rounded-lg">
        <div class="flex justify-between items-center mb-2 cursor-pointer" onclick="toggleSection('orderSection')">
           <label class="font-bold text-gray-700 cursor-pointer">📥 歸位收納順序</label>
           <span id="orderSectionIcon" class="text-gray-500">▼</span>
        </div>
        <div id="orderSection" class="transition-all duration-300">
            <ul id="orderList" class="space-y-2"></ul>
            <button onclick="addOrderRow()" class="mt-2 text-sm text-teal-600 font-bold hover:underline">+ 新增步驟</button>
        </div>
      </div>

      <!-- 特別提醒 (可折疊) -->
      <div class="border border-red-200 p-4 rounded-lg bg-red-50">
        <div class="flex justify-between items-center mb-2">
          <label class="font-bold text-red-700 cursor-pointer flex items-center gap-2" onclick="toggleSection('noteSection')">
              ⚠️ 收納特別提醒 <span id="noteSectionIcon" class="text-red-500 text-sm">▼</span>
          </label>
          <label class="flex items-center gap-1 text-sm cursor-pointer text-red-700">
            <input type="checkbox" id="showNote" checked onchange="updatePreview()"> 顯示區塊
          </label>
        </div>
        <div id="noteSection" class="transition-all duration-300">
            <div id="noteContainer">
              <div class="flex gap-2 mb-2">
                 <input type="text" id="specialNote" value="請分類整齊放入膠籃" class="flex-1 p-2 border rounded border-red-300" oninput="updatePreview()">
              </div>
            </div>
        </div>
      </div>

      <button onclick="saveLabelToQueue()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-lg">
        🔽 儲存至完成清單
      </button>

    </div>
  </div>

  <!-- 右側區域：預覽與清單 -->
  <div class="w-2/3 h-full bg-gray-200 flex flex-col print:w-full print:h-auto print:hidden">
    
    <!-- 上半部：即時預覽 -->
    <div class="flex-grow flex flex-col" style="flex-basis: 70%;">
        <div class="p-3 bg-gray-800 text-white font-bold shrink-0">👁️ 即時預覽 (Live Preview)</div>
        <div class="flex-1 overflow-y-auto p-4 flex justify-center bg-gray-300">
            <div class="preview-container">
                <div id="livePreview" class="label-card"></div>
            </div>
        </div>
    </div>

    <div class="h-1 bg-gray-400 shrink-0 shadow-inner"></div>

    <!-- 下半部：完成清單區 -->
    <div class="flex flex-col bg-white border-t" style="flex-basis: 30%; min-height: 200px;">
        <div class="p-2 bg-gray-700 text-white font-bold shrink-0 flex justify-between items-center text-sm">
            <span>✅ 完成標籤清單</span>
            <div class="space-x-2">
                <button onclick="batchPrint()" class="bg-teal-500 hover:bg-teal-600 px-3 py-1 rounded shadow text-white font-bold">🖨️ 批次列印 (雙拼)</button>
                <button onclick="clearQueue()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded shadow text-white font-bold">清空清單</button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-3">
            <div class="mb-2 border-b pb-2">
                <label class="cursor-pointer font-bold text-sm text-gray-700"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" checked> 全選</label>
            </div>
            <div id="queueList" class="space-y-1">
                <div class="text-gray-500 text-sm text-center py-4">目前無完成的標籤，請點擊左側底部「儲存至完成清單」。</div>
            </div>
        </div>
    </div>
  </div>

  <div id="print-area"></div>

<script>
  let orderData = [
    { text: "日用品櫃 01 (本櫃)", isTarget: true }
  ];
  let locData = [];
  let multiItems = [
    { name: "塑膠籃 (白)", cabinetQty: "34", totalQty: "34" }
  ];
  let completedLabels = [];
  let noOtherLocs = true;

  function init() {
    renderMultiItems();
    renderOrderList();
    renderLocList();
    toggleNoOtherLocs(true); // 預設初始化為無其他區
    updatePreview();
  }
  
  function toggleSection(sectionId) {
      const section = document.getElementById(sectionId);
      const icon = document.getElementById(sectionId + 'Icon');
      if(icon) {
          if (section.style.display === 'none' || section.classList.contains('hidden')) {
              section.style.display = 'block';
              section.classList.remove('hidden');
              icon.textContent = '▼';
          } else {
              section.style.display = 'none';
              icon.textContent = '▶';
          }
      } else {
          section.classList.toggle('hidden');
      }
  }

  // --- 多物品處理邏輯 ---
  function renderMultiItems() {
      const container = document.getElementById('multiItemsContainer');
      container.innerHTML = multiItems.map((item, idx) => `
          <div class="bg-white p-2 border border-blue-200 rounded relative shadow-sm">
             <button onclick="removeMultiItem(${idx})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-red-600">✖</button>
             <input type="text" class="w-full p-1 border-b border-gray-300 font-bold text-gray-800 focus:outline-none focus:border-blue-500 mb-2" value="${item.name}" placeholder="物品名稱 (如: 塑膠籃)" oninput="updateMultiItem(${idx}, 'name', this.value)">
             <div class="flex gap-2 text-sm">
                 <div class="flex-1 flex items-center bg-yellow-50 px-2 rounded border border-yellow-200">
                     <span class="text-yellow-700 whitespace-nowrap mr-1">本櫃</span>
                     <input type="text" class="w-full bg-transparent font-bold text-center focus:outline-none" value="${item.cabinetQty}" oninput="updateMultiItem(${idx}, 'cabinetQty', this.value)">
                 </div>
                 <div class="flex-1 flex items-center bg-gray-100 px-2 rounded border border-gray-200">
                     <span class="text-gray-600 whitespace-nowrap mr-1">總量</span>
                     <input type="text" class="w-full bg-transparent font-bold text-center focus:outline-none" value="${item.totalQty}" oninput="updateMultiItem(${idx}, 'totalQty', this.value)">
                 </div>
             </div>
          </div>
      `).join('');
      updatePreview();
  }
  function addMultiItemRow() { multiItems.push({ name: "新物品", cabinetQty: "0", totalQty: "0" }); renderMultiItems(); }
  function removeMultiItem(idx) { multiItems.splice(idx, 1); renderMultiItems(); }
  function updateMultiItem(idx, field, val) { multiItems[idx][field] = val; updatePreview(); }

  // --- 無其他備用區切換邏輯 ---
  function toggleNoOtherLocs(initCall = false) {
      if(!initCall) { noOtherLocs = document.getElementById('noOtherLocsFlag').checked; }
      else { document.getElementById('noOtherLocsFlag').checked = true; noOtherLocs = true; }
      
      const locContainer = document.getElementById('otherLocsContainer');
      const noLocMsg = document.getElementById('noLocMsg');
      
      if(noOtherLocs) {
          locContainer.style.display = 'none';
          noLocMsg.style.display = 'block';
      } else {
          locContainer.style.display = 'block';
          noLocMsg.style.display = 'none';
      }
      updatePreview();
  }

  function updatePreview() {
    const cabinetName = document.getElementById('cabinetName').value;
    
    // 字級與間距
    const cabinetNameSize = document.getElementById('cabinetNameSize').value || 26;
    const itemNameSize = document.getElementById('itemNameSize').value || 28;
    const qtySize = document.getElementById('qtySize').value || 24;
    const baseTextSize = document.getElementById('baseTextSize').value || 16;
    const gapSize = document.getElementById('gapSize').value || 16;

    // 圖片
    const showImage = document.getElementById('showImage').checked;
    const imgSrc = document.getElementById('imageUpload').dataset.src || document.getElementById('imageUrl').value || 'https://via.placeholder.com/400x200?text=無實景圖';
    document.getElementById('imageInputSection').style.display = showImage ? 'block' : 'none';

    // 提醒
    const showNote = document.getElementById('showNote').checked;
    const specialNote = document.getElementById('specialNote').value;
    document.getElementById('noteContainer').style.display = showNote ? 'block' : 'none';

    // 生成左欄物品清單 HTML (多物品列表排版)
    let multiItemsHtml = multiItems.map(item => `
        <div class="multi-item-row flex flex-col" style="gap: ${gapSize/4}px;">
            <div class="text-gray-800 font-black" style="font-size: ${itemNameSize}px; line-height: 1.2;">${item.name}</div>
            <div class="flex gap-3">
                <div class="bg-yellow-50 border border-yellow-400 rounded px-2 py-1 flex items-center gap-2 shadow-sm">
                    <span class="text-yellow-800 font-bold" style="font-size: ${baseTextSize}px;">本櫃收納</span>
                    <span class="text-yellow-600 font-black" style="font-size: ${qtySize}px;">${item.cabinetQty}</span>
                </div>
                <div class="bg-gray-50 border border-gray-300 rounded px-2 py-1 flex items-center gap-2 shadow-sm">
                    <span class="text-gray-600 font-bold" style="font-size: ${baseTextSize}px;">總庫存</span>
                    <span class="text-gray-800 font-black" style="font-size: ${qtySize}px;">${item.totalQty}</span>
                </div>
            </div>
        </div>
    `).join('');

    // 生成收納順序 HTML
    let orderHtml = orderData.map((item, idx) => `
      <div class="flex items-center gap-3 p-2 rounded ${item.isTarget ? 'bg-teal-50 border border-teal-200' : 'bg-gray-50'}" style="font-size: ${baseTextSize}px;">
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${item.isTarget ? 'bg-teal-600 text-white' : 'bg-gray-300 text-gray-700'}">${idx + 1}</div>
        <div class="font-medium text-gray-700 ${item.isTarget ? 'text-teal-800' : ''}">${item.text} ${item.isTarget ? '<span class="text-xs font-bold bg-teal-200 text-teal-800 px-1 rounded ml-1">[本櫃]</span>' : ''}</div>
      </div>
    `).join('');

    // 生成其他儲位 HTML
    let locHtml = "";
    if (noOtherLocs) {
        locHtml = `<div class="p-3 bg-gray-100 text-gray-500 rounded border border-gray-200 text-center font-bold" style="font-size: ${baseTextSize}px;">🚫 本櫃限定，無其他儲放區</div>`;
    } else {
        locHtml = locData.map(loc => `
          <div class="flex justify-between py-2 border-b border-gray-100 last:border-0 text-gray-600" style="font-size: ${baseTextSize}px;">
            <span>${loc.name}</span>
            <span class="font-bold">${loc.qty}</span>
          </div>
        `).join('');
    }

    const html = `
      <div class="h-full flex flex-col relative bg-white">
        
        <!-- 頂部櫃位標題 -->
        <div class="border-b-4 border-teal-600 pb-2 shrink-0" style="margin-bottom: ${gapSize}px;">
          <div class="inline-block bg-teal-500 text-white px-6 py-2 rounded-t-lg rounded-br-lg font-bold shadow-sm" style="font-size: ${cabinetNameSize}px;">
            📍 ${cabinetName}
          </div>
        </div>

        <!-- 內容雙欄配置 -->
        <div class="flex flex-1 min-h-0" style="gap: ${gapSize}px;">
          
          <!-- 左欄：多物品清單清單 + 提醒 -->
          <div class="w-1/2 flex flex-col h-full overflow-hidden" style="gap: ${gapSize}px;">
             
             <!-- 物品列表區 (可滾動或彈性撐開) -->
             <div class="flex-1 overflow-y-auto pr-2 border-2 border-blue-100 bg-white rounded-xl p-4 shadow-inner">
                ${multiItemsHtml}
             </div>

             ${showNote ? `
             <div class="bg-red-50 border-2 border-red-400 text-red-700 rounded-lg p-3 shrink-0">
               <div class="font-black flex items-center gap-2 mb-1"><span class="bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">!</span> 特別提醒</div>
               <div class="font-bold" style="font-size: ${baseTextSize}px; line-height: 1.3;">${specialNote}</div>
             </div>
             ` : ''}
          </div>

          <!-- 右欄：圖片、收納順序、其他區 -->
          <div class="w-1/2 flex flex-col h-full overflow-hidden" style="gap: ${gapSize}px;">
            
            ${showImage ? `
            <div class="shrink-0 h-40 border-2 border-gray-200 rounded-xl p-1 flex items-center justify-center overflow-hidden bg-gray-50">
              <img src="${imgSrc}" class="max-h-full max-w-full object-contain mix-blend-multiply">
            </div>
            ` : ''}

            <div class="border-2 border-gray-200 rounded-xl p-4 flex-1 flex flex-col min-h-0">
              <div class="font-bold text-gray-700 mb-2 flex items-center gap-2 shrink-0" style="font-size: ${baseTextSize}px;">
                📥 歸位收納優先順序
              </div>
              <div class="space-y-2 overflow-y-auto pr-1">${orderHtml}</div>
            </div>
            
            <div class="border-2 border-gray-200 rounded-xl p-4 shrink-0 flex flex-col ${noOtherLocs ? 'bg-gray-50 border-dashed' : ''}">
              <div class="font-bold text-gray-700 mb-2 flex items-center gap-2 shrink-0" style="font-size: ${baseTextSize}px;">
                🔍 其他儲放區
              </div>
              <div class="overflow-y-auto pr-1">${locHtml}</div>
            </div>

          </div>
        </div>
      </div>
    `;
    document.getElementById('livePreview').innerHTML = html;
  }

  // --- 拖曳排序邏輯 ---
  let draggedIndex = null;
  function renderOrderList() {
    const list = document.getElementById('orderList');
    list.innerHTML = orderData.map((item, idx) => `
      <li class="flex gap-2 items-center" draggable="true" ondragstart="dragStart(event, ${idx})" ondragover="dragOver(event)" ondrop="drop(event, ${idx})" ondragend="dragEnd()">
        <span class="drag-handle text-gray-400 px-1">☰</span>
        <input type="radio" name="targetLoc" ${item.isTarget ? 'checked' : ''} onchange="setTargetLoc(${idx})">
        <input type="text" class="flex-1 p-1 border rounded text-sm" value="${item.text}" oninput="updateOrderText(${idx}, this.value)">
        <button onclick="removeOrderRow(${idx})" class="text-red-500 hover:text-red-700">✖</button>
      </li>
    `).join('');
    updatePreview();
  }
  function dragStart(e, idx) { draggedIndex = idx; e.target.classList.add('dragging'); }
  function dragOver(e) { e.preventDefault(); }
  function drop(e, targetIdx) { e.preventDefault(); if (draggedIndex === null || draggedIndex === targetIdx) return; const item = orderData.splice(draggedIndex, 1)[0]; orderData.splice(targetIdx, 0, item); renderOrderList(); }
  function dragEnd() { document.querySelectorAll('.dragging').forEach(i => i.classList.remove('dragging')); draggedIndex = null; }
  function addOrderRow() { orderData.push({ text: "新步驟", isTarget: false }); renderOrderList(); }
  function removeOrderRow(idx) { orderData.splice(idx, 1); renderOrderList(); }
  function updateOrderText(idx, val) { orderData[idx].text = val; updatePreview(); }
  function setTargetLoc(idx) { orderData.forEach((item, i) => item.isTarget = (i === idx)); updatePreview(); }

  // --- 其他儲位列表邏輯 ---
  function renderLocList() {
    const list = document.getElementById('locList');
    list.innerHTML = locData.map((loc, idx) => `
      <li class="flex gap-2 items-center">
        <input type="text" class="flex-1 p-1 border rounded text-sm" value="${loc.name}" oninput="updateLocName(${idx}, this.value)" placeholder="櫃位名稱">
        <input type="text" class="w-20 p-1 border rounded text-sm" value="${loc.qty}" oninput="updateLocQty(${idx}, this.value)" placeholder="數量">
        <button onclick="removeLocRow(${idx})" class="text-red-500 hover:text-red-700">✖</button>
      </li>
    `).join('');
    updatePreview();
  }
  function addLocRow() { locData.push({ name: "", qty: "" }); renderLocList(); }
  function removeLocRow(idx) { locData.splice(idx, 1); renderLocList(); }
  function updateLocName(idx, val) { locData[idx].name = val; updatePreview(); }
  function updateLocQty(idx, val) { locData[idx].qty = val; updatePreview(); }

  // --- 圖片上傳邏輯 ---
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) { document.getElementById('imageUpload').dataset.src = evt.target.result; updatePreview(); };
      reader.readAsDataURL(file);
    }
  }
  function updateImageFromUrl() {
    document.getElementById('imageUpload').dataset.src = document.getElementById('imageUrl').value.trim();
    updatePreview();
  }

  // --- 輸出與列印邏輯 ---
  function downloadPreviewPNG() {
    html2canvas(document.getElementById('livePreview'), { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = document.getElementById('cabinetName').value + '_標籤.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function saveLabelToQueue() {
    const html = document.getElementById('livePreview').innerHTML;
    const cabinet = document.getElementById('cabinetName').value;
    const name = multiItems.length > 1 ? `[組合] ${multiItems[0].name} 等${multiItems.length}項` : multiItems[0].name;
    
    completedLabels.push({ id: Date.now(), name, cabinet, html });
    renderQueueList();
  }

  function renderQueueList() {
    const container = document.getElementById('queueList');
    if(completedLabels.length === 0) {
        container.innerHTML = '<div class="text-gray-500 text-sm text-center py-4">目前無完成的標籤，請點擊左側底部「儲存至完成清單」。</div>';
        return;
    }
    
    container.innerHTML = completedLabels.map((item, idx) => `
      <div class="flex items-center justify-between p-2 border-b hover:bg-gray-50 text-sm">
        <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" class="queue-checkbox w-4 h-4 text-teal-600" data-idx="${idx}" checked>
            <div>
                <span class="inline-block bg-gray-200 text-gray-800 text-xs px-2 py-1 rounded font-bold mr-2">${item.cabinet}</span>
                <span class="font-bold text-gray-700">${item.name}</span>
            </div>
        </label>
        <button onclick="removeQueueItem(${idx})" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-xs font-bold">刪除</button>
      </div>
    `).join('');
  }

  function toggleSelectAll(checkbox) {
    const checkboxes = document.querySelectorAll('.queue-checkbox');
    checkboxes.forEach(cb => cb.checked = checkbox.checked);
  }

  function removeQueueItem(idx) {
    completedLabels.splice(idx, 1);
    renderQueueList();
  }

  function clearQueue() {
    if(confirm('確定要清空清單內所有標籤嗎？')) {
      completedLabels = [];
      renderQueueList();
    }
  }

  function batchPrint() {
    const checkboxes = document.querySelectorAll('.queue-checkbox:checked');
    if(checkboxes.length === 0) {
        alert('請至少勾選一張標籤進行列印！');
        return;
    }

    const printArea = document.getElementById('print-area');
    printArea.innerHTML = '';
    
    const selectedHtmls = Array.from(checkboxes).map(cb => {
        const idx = parseInt(cb.getAttribute('data-idx'));
        return completedLabels[idx].html;
    });

    for(let i = 0; i < selectedHtmls.length; i += 2) {
        const page = document.createElement('div');
        page.className = 'print-page';
        
        const card1 = document.createElement('div');
        card1.className = 'label-card';
        card1.innerHTML = selectedHtmls[i];
        page.appendChild(card1);

        if(i + 1 < selectedHtmls.length) {
            const card2 = document.createElement('div');
            card2.className = 'label-card';
            card2.innerHTML = selectedHtmls[i+1];
            page.appendChild(card2);
        }
        printArea.appendChild(page);
    }
    window.print();
  }

  window.onload = init;
</script>
</body>
</html>
